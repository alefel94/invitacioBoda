<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirmación de Asistencia — Viridiana &amp; Felipe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='26'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mrs+Saint+Delafield&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-moss rsvp-page">

<!-- ============ MÚSICA DE FONDO (sigue sonando desde la portada) ============ -->
<audio id="bgMusic" loop preload="none">
  <source src="assets/audio/song.mp3" type="audio/mpeg">
</audio>
<button class="music-toggle" id="musicToggle" type="button" aria-label="Silenciar música" aria-pressed="false" hidden>
  <span class="icon-playing eq" aria-hidden="true">
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
    <span class="eq-bar"></span>
  </span>
  <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.2v11.6c0 .9 1 1.5 1.8 1L18.5 13.8a1.2 1.2 0 0 0 0-1.9L9.8 5.2c-.8-.5-1.8.1-1.8 1Z" fill="currentColor"/></svg>
</button>

<main class="rsvp-standalone">
  <div class="rsvp-card">
    <span class="rsvp-sheet-handle" aria-hidden="true"></span>
    <div class="monogram"><span class="heart">♥</span> V &amp; F</div>
    <p class="eyebrow eyebrow--center">Confírmanos</p>
    <h1 class="section-heading">Confirmación de Asistencia</h1>
    <div class="divider-motif" aria-hidden="true"><span>✦</span></div>
    <p class="rsvp-deadline">Por favor, confirma tu asistencia antes del 15 de Octubre de 2026.</p>

    <form class="rsvp-form" id="rsvpForm" novalidate>
      <div class="field field-autocomplete">
        <label for="fullName">Nombre</label>
        <input type="text" id="fullName" name="fullName" placeholder="Juan Pérez" required autocomplete="off">
        <ul class="autocomplete-list" id="fullNameSuggestions" hidden></ul>
      </div>

      <div class="field">
        <label for="attending">¿Asistirás?</label>
        <select id="attending" name="attending" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="yes">Sí, ahí estaré</option>
          <option value="no">No podré asistir</option>
        </select>
      </div>

      <div class="field field-collapsible is-hidden" id="guestCountField">
        <div class="field-collapsible-inner">
          <label for="guestCount">¿Cuántas personas asistirán?</label>
          <select id="guestCount" name="guestCount">
            <option value="1" selected>1 Persona</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="message">Comentarios y Felicitaciones</label>
        <textarea id="message" name="message" placeholder="Escribe tus felicitaciones o comentarios aquí…"></textarea>
      </div>

      <button type="submit" class="btn btn-solid" id="rsvpSubmit">Confirmar</button>
      <p class="form-note" id="rsvpNote" role="status"></p>
    </form>

    <div class="burn-letter" id="burnLetter" hidden aria-hidden="true">
      <div class="burn-stage">
        <div class="burn-paper">
          <span class="burn-heading">♥ V &amp; F</span>
          <svg class="burn-script" viewBox="0 0 100 92" fill="none" stroke="#5a4636" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6 Q18 0 32 6 T60 6 T90 4"/>
            <path d="M4 22 Q16 28 28 22 T52 24 T76 20 T96 24"/>
            <path d="M4 40 Q20 34 36 40 T68 38"/>
            <path d="M4 56 Q14 62 26 56 T50 58 T74 54 T92 58"/>
            <path d="M4 74 Q24 68 44 74 T84 72" opacity="0.7"/>
          </svg>
        </div>
        <div class="burn-glow"></div>
        <span class="burn-ember burn-ember-1"></span>
        <span class="burn-ember burn-ember-2"></span>
        <span class="burn-ember burn-ember-3"></span>
      </div>
    </div>

    <div class="rsvp-success" id="rsvpSuccess">
      <span class="heart-icon-wrap" aria-hidden="true">
        <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7.5-4.9-10-9.3C.5 8.1 2.3 4.5 6 4c2.1-.3 3.8.8 6 3 2.2-2.2 3.9-3.3 6-3 3.7.5 5.5 4.1 4 7.7C19.5 16.1 12 21 12 21Z"/></svg>
      </span>
      <h3 id="rsvpSuccessTitle">¡Gracias por confirmar!</h3>
      <p id="rsvpSuccessText">Hemos recibido tu respuesta. En un momento te llevamos a la invitación ♥</p>
    </div>
  </div>
</main>

<script src="js/music.js"></script>
<script src="js/rsvp.js"></script>
</body>
</html>
