<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de RSVP — Viridiana &amp; Felipe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-page">

<!-- ============ LOGIN ============ -->
<section class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="monogram"><span class="heart">♥</span> V &amp; F</div>
    <h1>Panel de confirmaciones</h1>
    <p class="hint">Acceso privado. Ingresa la contraseña para ver el RSVP.</p>
    <form id="loginForm">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-solid" id="loginSubmit">Entrar</button>
      <p class="form-note" id="loginNote" role="status"></p>
    </form>
  </div>
</section>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" hidden>
  <header class="admin-topbar">
    <div class="monogram"><span class="heart">♥</span> V &amp; F — RSVP</div>
    <div class="admin-topbar-actions">
      <button class="btn btn-outline btn-sm" id="refreshBtn">Actualizar</button>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Salir</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-tabs">
      <button class="admin-tab is-active" id="tabResponsesBtn" type="button">Confirmaciones</button>
      <button class="admin-tab" id="tabGuestsBtn" type="button">Invitados</button>
    </div>

    <!-- ---- Confirmaciones (respuestas crudas del formulario) ---- -->
    <section id="panelResponses">
      <div class="stats-row">
        <div class="stat-tile">
          <div class="stat-number" id="statResponses">0</div>
          <div class="stat-label">Respuestas</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statGuests">0</div>
          <div class="stat-label">Invitados confirmados</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statDeclined">0</div>
          <div class="stat-label">No asisten</div>
        </div>
      </div>

      <div id="tableContainer">
        <p class="admin-loading">Cargando confirmaciones…</p>
      </div>
    </section>

    <!-- ---- Invitados (tu lista precargada, con boletos y estado) ---- -->
    <section id="panelGuests" hidden>
      <div class="stats-row">
        <div class="stat-tile">
          <div class="stat-number" id="statGuestTotal">0</div>
          <div class="stat-label">Invitaciones</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statTicketsUsed">0</div>
          <div class="stat-label">Boletos confirmados</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statTicketsTotal">0</div>
          <div class="stat-label">Boletos asignados</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statPending">0</div>
          <div class="stat-label">Pendientes</div>
        </div>
      </div>

      <div class="guests-toolbar">
        <button class="btn btn-solid btn-sm" id="addGuestBtn" type="button">+ Agregar invitado</button>
      </div>

      <div id="guestsTableContainer">
        <p class="admin-loading">Cargando invitados…</p>
      </div>
    </section>
  </main>
</div>

<!-- ============ MODAL: agregar / editar invitado ============ -->
<div class="guest-modal" id="guestModal" hidden>
  <div class="guest-modal-card">
    <button class="rsvp-overlay-close" id="guestModalClose" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>
    <h2 id="guestModalTitle">Agregar invitado</h2>
    <form id="guestForm" novalidate>
      <input type="hidden" id="guestId" name="guestId">
      <div class="field">
        <label for="guestDisplayName">Nombre</label>
        <input type="text" id="guestDisplayName" name="displayName" placeholder="Familia Pérez García" required>
      </div>
      <div class="field">
        <label for="guestGroup">Grupo (opcional)</label>
        <input type="text" id="guestGroup" name="guestGroup" placeholder="Familia, Amigos, Trabajo…">
      </div>
      <div class="field">
        <label for="guestAllowed">Boletos asignados</label>
        <input type="number" id="guestAllowed" name="allowedGuests" min="1" max="30" value="1" required>
      </div>
      <div class="field">
        <label for="guestPhone">Teléfono (opcional)</label>
        <input type="tel" id="guestPhone" name="phone" placeholder="+52 33 0000 0000">
      </div>
      <button type="submit" class="btn btn-solid" id="guestFormSubmit">Guardar</button>
      <p class="form-note" id="guestFormNote" role="status"></p>
    </form>
  </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
